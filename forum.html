<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Fnaf Community Forum</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        .minecraft-font { 
            font-family: 'Press Start 2P', cursive; 
        }
        
        body {
            background: linear-gradient(135deg, #1F2937 0%, #111827 100%);
            min-height: 100vh;
        }
        
        .forum-container {
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid #374151;
        }
        
        .post-card {
            background: rgba(55, 65, 81, 0.7);
            border: 2px solid #4B5563;
            transition: all 0.3s ease;
        }
        
        .post-card:hover {
            border-color: #10B981;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.15);
        }
        
        .category-suggestion { border-left: 4px solid #3B82F6; }
        .category-bug { border-left: 4px solid #EF4444; }
        .category-discussion { border-left: 4px solid #10B981; }
        
        .btn-primary {
            background: linear-gradient(145deg, #059669, #047857);
            border: 2px solid #065F46;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(145deg, #047857, #065F46);
            transform: translateY(-1px);
        }
        
        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
        
        .username-input {
            background: rgba(55, 65, 81, 0.9);
            border: 2px solid #6B7280;
            transition: all 0.3s ease;
        }
        
        .username-input:focus {
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        
        /* Стили для скроллбара */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1F2937;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4B5563;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #6B7280;
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        .pixel-corners {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Навигация -->
    <nav class="bg-gray-800 p-4 border-b-2 border-green-500">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <h1 class="text-green-400 minecraft-font text-lg">Tea Fnaf Forum</h1>
                <div class="hidden sm:block w-px h-6 bg-gray-600"></div>
                <a href="index.html" class="text-green-400 hover:text-green-300 text-sm flex items-center">
                    <i data-feather="arrow-left" class="w-4 h-4 mr-1"></i>
                    Back to Download
                </a>
            </div>
            <div id="userInfo" class="hidden flex items-center space-x-3">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    <span class="text-white text-sm" id="usernameDisplay"></span>
                </div>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-white text-sm flex items-center">
                    <i data-feather="log-out" class="w-3 h-3 mr-1"></i>
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Модальное окно выбора ника -->
    <div id="usernameModal" class="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
        <div class="forum-container p-8 rounded-xl w-full max-w-md fade-in">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-amber-800 border-4 border-amber-900 flex items-center justify-center mx-auto mb-4">
                    <span class="text-2xl font-bold text-white minecraft-font">F</span>
                </div>
                <h2 class="text-green-400 minecraft-font text-lg mb-2">Choose Your Username</h2>
                <p class="text-gray-400 text-sm">Join our community and share your ideas!</p>
            </div>
            
            <input type="text" id="usernameInput" placeholder="Enter your username" 
                   class="w-full p-4 username-input text-white rounded-lg mb-4 minecraft-font text-sm">
            
            <button onclick="setUsername()" class="w-full btn-primary text-white py-3 rounded-lg minecraft-font text-sm flex items-center justify-center">
                <i data-feather="user-plus" class="w-4 h-4 mr-2"></i>
                Join Community Forum
            </button>
            
            <p id="usernameError" class="text-red-400 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- Основной контент форума -->
    <div class="container mx-auto p-4 max-w-4xl">
        <!-- Приветствие -->
        <div class="forum-container p-6 rounded-xl mb-6 text-center fade-in hidden" id="welcomeMessage">
            <h2 class="text-green-400 minecraft-font text-lg mb-2">Welcome to Tea Fnaf Community!</h2>
            <p class="text-gray-300 text-sm">Share your suggestions, report bugs, and discuss with other players.</p>
        </div>

        <!-- Форма создания поста -->
        <div class="forum-container p-6 rounded-xl mb-6 fade-in hidden" id="createPostForm">
            <h3 class="text-white minecraft-font text-sm mb-4 flex items-center">
                <i data-feather="edit-3" class="w-4 h-4 mr-2"></i>
                Create New Post
            </h3>
            
            <input type="text" id="postTitle" placeholder="Post title..." 
                   class="w-full p-3 username-input text-white rounded-lg mb-3 text-sm">
            
            <textarea id="postContent" placeholder="Share your ideas, suggestions, or bug reports..." 
                     class="w-full p-3 username-input text-white rounded-lg mb-3 h-32 text-sm resize-none"></textarea>
            
            <div class="flex flex-col sm:flex-row gap-3 mb-4">
                <select id="postCategory" class="flex-1 p-3 username-input text-white rounded-lg text-sm">
                    <option value="suggestion">Suggestion</option>
                    <option value="bug">Bug Report</option>
                    <option value="discussion">Discussion</option>
                </select>
                
                <button onclick="createPost()" class="btn-primary text-white px-6 py-3 rounded-lg text-sm flex items-center justify-center">
                    <i data-feather="send" class="w-4 h-4 mr-2"></i>
                    Create Post
                </button>
            </div>
        </div>

        <!-- Статистика -->
        <div class="forum-container p-4 rounded-xl mb-6 fade-in hidden" id="statsSection">
            <div class="flex justify-around text-center">
                <div>
                    <div class="text-green-400 minecraft-font text-sm" id="postsCount">0</div>
                    <div class="text-gray-400 text-xs">Total Posts</div>
                </div>
                <div>
                    <div class="text-green-400 minecraft-font text-sm" id="usersCount">0</div>
                    <div class="text-gray-400 text-xs">Community Members</div>
                </div>
                <div>
                    <div class="text-green-400 minecraft-font text-sm" id="todayPosts">0</div>
                    <div class="text-gray-400 text-xs">Posts Today</div>
                </div>
            </div>
        </div>

        <!-- Список постов -->
        <div id="postsContainer" class="space-y-4 fade-in">
            <!-- Посты будут загружаться здесь -->
            <div class="text-center py-12">
                <div class="text-gray-500 minecraft-font text-sm">Loading community posts...</div>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/forum.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
