<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resourcepack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        .minecraft-font {
            font-family: 'Press Start 2P', cursive;
        }
        body {
            background-image: url('screen.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .content-container {
            background-color: rgba(31, 41, 55, 0.9);
        }
        .version-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .version-active {
            cursor: pointer;
            transition: all 0.2s;
        }
        .version-active:hover {
            background-color: rgba(74, 85, 104, 0.5);
        }
        .version-selected {
            background-color: rgba(74, 85, 104, 0.8);
            border: 2px solid #10B981;
        }
        .version-development {
            border: 2px solid #F59E0B;
        }
        .text-yellow-400 {
            color: #F59E0B;
        }
        .tab-button {
            transition: all 0.3s;
        }
        .tab-button.active {
            background-color: rgba(55, 65, 81, 0.9);
            border-bottom: 2px solid #10B981;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="flex max-w-5xl w-full gap-6">
        <!-- История версий слева -->
        <div class="w-1/3 content-container rounded-xl overflow-hidden shadow-2xl">
            <!-- Табы для переключения между версиями -->
            <div class="flex border-b border-gray-600">
                <button class="flex-1 tab-button active py-3 text-green-400 minecraft-font text-xs" onclick="switchTab('legacy')">
                    Legacy
                </button>
                <button class="flex-1 tab-button py-3 text-blue-400 minecraft-font text-xs" onclick="switchTab('v2')">
                    v2.0
                </button>
            </div>
            
            <div class="p-4">
                <!-- Legacy Tab Content -->
                <div id="legacy-tab" class="tab-content">
                    <h2 class="text-lg font-bold text-green-400 mb-4 minecraft-font text-center">Version History</h2>
                    <div class="space-y-2">
                        <!-- Версии 1.0-1.7 - отключены -->
                        <div class="version-disabled p-3 bg-gray-700 rounded-lg text-center">
                            <div class="text-red-400 minecraft-font text-xs">v1.0</div>
                            <div class="text-gray-400 text-xs mt-1">Old</div>
                        </div>
                        <div class="version-disabled p-3 bg-gray-700 rounded-lg text-center">
                            <div class="text-red-400 minecraft-font text-xs">v1.1</div>
                            <div class="text-gray-400 text-xs mt-1">Old</div>
                        </div>
                        <div class="version-disabled p-3 bg-gray-700 rounded-lg text-center">
                            <div class="text-red-400 minecraft-font text-xs">v1.2</div>
                            <div class="text-gray-400 text-xs mt-1">Old</div>
                        </div>
                        <div class="version-disabled p-3 bg-gray-700 rounded-lg text-center">
                            <div class="text-red-400 minecraft-font text-xs">v1.3</div>
                            <div class="text-gray-400 text-xs mt-1">Old</div>
                        </div>
                        <div class="version-disabled p-3 bg-gray-700 rounded-lg text-center">
                            <div class="text-red-400 minecraft-font text-xs">v1.4</div>
                            <div class="text-gray-400 text-xs mt-1">Old</div>
                        </div>
                        <div class="version-disabled p-3 bg-gray-700 rounded-lg text-center">
                            <div class="text-red-400 minecraft-font text-xs">v1.5</div>
                            <div class="text-gray-400 text-xs mt-1">Old</div>
                        </div>
                        <div class="version-disabled p-3 bg-gray-700 rounded-lg text-center">
                            <div class="text-red-400 minecraft-font text-xs">v1.6</div>
                            <div class="text-gray-400 text-xs mt-1">Disabled</div>
                        </div>
                        <div class="version-disabled p-3 bg-gray-700 rounded-lg text-center">
                            <div class="text-red-400 minecraft-font text-xs">v1.7</div>
                            <div class="text-gray-400 text-xs mt-1">Disabled</div>
                        </div>
                        
                        <!-- Версия 1.8 -->
                        <div class="version-active p-3 bg-gray-700 rounded-lg text-center" id="version-1.8" onclick="selectVersion('1.8')">
                            <div class="text-green-400 minecraft-font text-xs">v1.8</div>
                            <div class="text-gray-300 text-xs mt-1">Available</div>
                        </div>

                        <!-- Версия 1.9 -->
                        <div class="version-active version-selected p-3 bg-gray-700 rounded-lg text-center" id="version-1.9" onclick="selectVersion('1.9')">
                            <div class="text-green-400 minecraft-font text-xs">v1.9</div>
                            <div class="text-gray-300 text-xs mt-1">Available</div>
                        </div>
                        
                        <!-- Версия EXTRA-1.9 - Development -->
                        <div class="version-active p-3 bg-gray-700 rounded-lg text-center" id="version-extra-1.9" onclick="selectVersion('extra-1.9')">
                            <div class="text-yellow-400 minecraft-font text-xs">EXTRA-1.9</div>
                            <div class="text-gray-300 text-xs mt-1">Development</div>
                        </div>
                    </div>
                </div>

                <!-- v2.0 Tab Content -->
                <div id="v2-tab" class="tab-content hidden">
                    <h2 class="text-lg font-bold text-blue-400 mb-4 minecraft-font text-center">v2.0 Series</h2>
                    <div class="space-y-2">
                        <!-- Версия 2.0 -->
                        <div class="version-active version-selected p-3 bg-gray-700 rounded-lg text-center" id="version-2.0" onclick="selectVersion('2.0')">
                            <div class="text-blue-400 minecraft-font text-xs">v2.0</div>
                            <div class="text-gray-300 text-xs mt-1">Latest</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Основной контент справа -->
        <div class="flex-1 content-container rounded-xl overflow-hidden shadow-2xl">
            <div class="p-6 text-center">
                <h1 class="text-2xl font-bold text-green-400 mb-6 minecraft-font">Tea Fnaf Resourcepack</h1>
                
                <div class="w-64 h-64 mx-auto mb-8 relative">
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-40 h-40 bg-amber-800 border-4 border-amber-900 flex items-center justify-center">
                            <span class="text-6xl font-bold text-white minecraft-font">F</span>
                        </div>
                    </div>
                </div>
                
                <p class="text-gray-300 mb-6 text-sm">
                    Custom Resourcepack for map "Tea Fnaf".
                </p>
                
                <div id="downloadSection">
                    <a href="#" id="downloadLink" class="inline-block px-6 py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg transition duration-200 minecraft-font text-sm" onclick="downloadFile()">
                        <i data-feather="download" class="inline mr-2"></i> Download v1.9
                    </a>
                    <p id="fileInfo" class="text-gray-400 text-xs mt-2">Downloading: FnafV1.9.zip</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        feather.replace();
        
        let currentVersion = '1.9';
        let currentTab = 'legacy';
        const versionFiles = {
            '1.8': 'FnafV1.8.zip',
            '1.9': 'FnafV1.9.zip',
            'extra-1.9': 'FnafEXTRA-1.9.zip',
            '2.0': 'FnafV2.0.zip',
        };

        function switchTab(tabName) {
            // Скрываем все табы
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            // Убираем активный класс со всех кнопок
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Показываем выбранный таб и активируем кнопку
            document.getElementById(`${tabName}-tab`).classList.remove('hidden');
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            
            currentTab = tabName;
            
            // Автоматически выбираем первую доступную версию при переключении таба
            if (tabName === 'legacy') {
                selectVersion('1.9');
            } else if (tabName === 'v2') {
                selectVersion('2.0');
            }
        }

        function selectVersion(version) {
            if (version === '1.8' || version === '1.9' || version === 'extra-1.9' || version === '2.0') {
                currentVersion = version;
                updateDownloadSection();
                
                // Обновляем выделение версий в активном табе
                if (currentTab === 'legacy') {
                    document.getElementById('version-1.8').classList.remove('version-selected', 'version-development');
                    document.getElementById('version-1.9').classList.remove('version-selected', 'version-development');
                    document.getElementById('version-extra-1.9').classList.remove('version-selected', 'version-development');
                    
                    // Добавляем соответствующий стиль для выбранной версии
                    const selectedElement = document.getElementById(`version-${version}`);
                    if (version === 'extra-1.9') {
                        selectedElement.classList.add('version-development');
                    } else {
                        selectedElement.classList.add('version-selected');
                    }
                } else if (currentTab === 'v2') {
                    document.getElementById('version-2.0').classList.add('version-selected');
                }
            }
        }

        function updateDownloadSection() {
            const downloadLink = document.getElementById('downloadLink');
            const fileInfo = document.getElementById('fileInfo');
            
            // Обновляем текст кнопки в зависимости от версии
            let buttonClass = 'inline-block px-6 py-3 text-white font-bold rounded-lg transition duration-200 minecraft-font text-sm';
            let buttonText = '';
            
            switch(currentVersion) {
                case 'extra-1.9':
                    buttonText = 'Download EXTRA-1.9';
                    buttonClass += ' bg-yellow-600 hover:bg-yellow-500';
                    break;
                case '2.0':
                    buttonText = 'Download v2.0';
                    buttonClass += ' bg-blue-600 hover:bg-blue-500';
                    break;
                default:
                    buttonText = `Download v${currentVersion}`;
                    buttonClass += ' bg-green-600 hover:bg-green-500';
                    break;
            }
            
            downloadLink.innerHTML = `<i data-feather="download" class="inline mr-2"></i> ${buttonText}`;
            downloadLink.className = buttonClass;
            fileInfo.textContent = `Downloading: ${versionFiles[currentVersion]}`;
            
            // Обновляем иконки Feather
            feather.replace();
        }

        function downloadFile() {
            const fileName = versionFiles[currentVersion];
            
            // Создаем временную ссылку для загрузки
            const link = document.createElement('a');
            link.href = fileName;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            console.log(`Попытка скачать файл: ${fileName}`);
            alert(`Загрузка ${fileName}.`);
        }

        // Изначальная настройка
        updateDownloadSection();
    </script>
</body>
</html>
